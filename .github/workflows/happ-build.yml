name: NekoBox Happ build (windows64)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/happ-decryptor
    paths-ignore:
      - "**.md"

jobs:
  build-windows64:
    runs-on: windows-2022
    steps:
      - name: Checking out sources
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # 14.2 is the toolset used by the upstream 4.0.1 release build
          toolset: 14.2
          arch: x64

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          # pinned: sing (linkname of net.errNoSuchInterface) breaks on Go >= 1.24
          go-version: "1.22.12"

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Cache Qt SDK
        id: cache-qtsdk
        uses: actions/cache@v4
        with:
          path: qtsdk
          key: QtSdkCache-windows-2022-Qt6.7

      - name: Download Custom Qt 6.7 SDK
        shell: bash
        if: steps.cache-qtsdk.outputs.cache-hit != 'true'
        env:
          DL_QT_VER: "6.7"
        run: bash ./libs/download_qtsdk_win.sh

      - name: Cache Download
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: libs/deps
          key: DepsCache-windows-2022-x64-${{ hashFiles('libs/build_deps_*.sh') }}-Qt6.7

      - name: Build Dependencies
        shell: bash
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: ./libs/build_deps_all.sh

      - name: Build public resources (geodata)
        shell: bash
        run: ./libs/build_public_res.sh

      - name: Generate MakeFile and Build GUI
        shell: bash
        env:
          DL_QT_VER: "6.7"
          CC: cl.exe
          CXX: cl.exe
        run: |
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          mkdir build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release ..
          ninja -j2
          cd ..
          ./libs/deploy_windows64.sh

      - name: Build golang parts (core)
        shell: bash
        run: |
          ./libs/get_source.sh
          GOOS=windows GOARCH=amd64 ./libs/build_go.sh

      - name: Happ decryptor tests
        working-directory: go/cmd/nekobox_core
        shell: bash
        run: go test ./happ/ -v

      - name: Pack
        shell: bash
        run: |
          cd deployment
          cp -r public_res/* windows64
          rm -rf public_res *.pdb
          tar czvf ../nekobox-happ-windows64.tgz windows64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekobox-happ-windows64
          path: nekobox-happ-windows64.tgz
